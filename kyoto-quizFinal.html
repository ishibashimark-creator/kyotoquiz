<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>京都 一問一答</title>
<style>
:root{
  --ai:#22314f;
  --ai-deep:#141c2e;
  --shu:#c1440e;
  --washi:#efe8d8;
  --washi-dim:#e2d8c2;
  --moss:#4b5d3a;
  --ink:#2a2620;
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--washi);
  background-image:
    radial-gradient(circle at 15% 20%, rgba(34,49,79,0.05) 0, transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(193,68,14,0.06) 0, transparent 45%);
  color:var(--ink);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  min-height:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;
  justify-content:center;
}
.wrap{
  width:100%;
  max-width:620px;
  padding:2.2rem 1.4rem 3rem;
}
.mark{display:flex;align-items:baseline;gap:0.6rem;margin-bottom:0.3rem;}
.mark .bar{width:2.6rem;height:3px;background:var(--shu);}
h1{font-size:1.5rem;letter-spacing:0.08em;margin:0 0 1.6rem;font-weight:600;color:var(--ai-deep);}
.card{
  background:#fbf8f0;
  border:1px solid var(--washi-dim);
  border-left:4px solid var(--ai);
  border-radius:2px;
  padding:1.6rem 1.5rem;
  box-shadow:0 1px 0 rgba(42,38,32,0.04);
}
.progress{font-size:0.8rem;color:var(--ai);letter-spacing:0.06em;margin-bottom:0.9rem;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;}
.tag{
  display:inline-block;
  font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:0.72rem;
  color:var(--shu);
  border:1px solid var(--shu);
  padding:0.1rem 0.5rem;
  border-radius:2px;
  margin-bottom:0.9rem;
}
.qtext{font-size:1.12rem;line-height:1.85;margin:0 0 1.4rem;color:var(--ink);}
input[type=text]{
  width:100%;font-size:1.05rem;font-family:inherit;padding:0.7rem 0.8rem;
  border:none;border-bottom:2px solid var(--ai);background:transparent;color:var(--ink);outline:none;
}
input[type=text]:focus{border-bottom-color:var(--shu);}
input[type=text]:disabled{color:#8a8374;}
.hint{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:0.78rem;color:#8a8374;margin-top:0.5rem;}
.reveal{margin-top:1.3rem;padding-top:1.1rem;border-top:1px dashed var(--washi-dim);animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.verdict{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:0.85rem;font-weight:600;letter-spacing:0.04em;margin-bottom:0.5rem;}
.verdict.ok{color:var(--moss);}
.verdict.no{color:var(--shu);}
.answer{font-size:1.25rem;color:var(--ai-deep);}
.your{margin-top:0.5rem;font-size:0.9rem;color:#8a8374;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;}
.btnrow{margin-top:1.5rem;display:flex;justify-content:flex-end;}
button{
  font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:0.9rem;letter-spacing:0.05em;
  background:var(--ai-deep);color:var(--washi);border:none;padding:0.65rem 1.5rem;cursor:pointer;border-radius:2px;
}
button:hover{background:var(--shu);}
button:disabled{background:#b9b2a0;cursor:not-allowed;}
button:focus-visible, input:focus-visible{outline:2px solid var(--shu); outline-offset:2px;}
.start, .final{text-align:center;padding:2.6rem 1rem;}
.start p, .final p{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);line-height:1.9;margin-bottom:1.6rem;}
.catlabel{
  font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:0.8rem;color:var(--ai);letter-spacing:0.06em;margin-bottom:0.8rem;text-align:left;
}
.catgrid{
  display:flex;flex-wrap:wrap;gap:0.6rem;justify-content:center;margin-bottom:1.8rem;
}
.catchip{
  font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:0.85rem;
  border:1px solid var(--ai);
  color:var(--ai);
  padding:0.45rem 1rem;
  border-radius:999px;
  cursor:pointer;
  user-select:none;
  transition:background .15s, color .15s;
}
.catchip input{position:absolute;opacity:0;pointer-events:none;}
.catchip.on{background:var(--ai-deep);color:var(--washi);border-color:var(--ai-deep);}
.catcount{
  font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:0.78rem;color:#8a8374;margin-bottom:1.4rem;
}
.score{font-size:3rem;color:var(--ai-deep);margin:0 0 0.3rem;}
.hidden{display:none;}
.reviewlist{text-align:left;margin-top:2rem;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:0.85rem;}
.reviewlist li{margin-bottom:0.9rem;line-height:1.6;}
.reviewlist .rq{color:var(--ink);}
.reviewlist .ra{color:var(--ai);}
.reviewlist .ok{color:var(--moss);}
.reviewlist .no{color:var(--shu);}
.menurow{margin-top:1rem;}
button.secondary{
  background:transparent;
  color:var(--ai);
  border:1px solid var(--ai);
}
button.secondary:hover{background:var(--ai);color:var(--washi);}
.memohint{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:0.8rem;color:#8a8374;margin-bottom:1.2rem;text-align:left;}
.memolist{list-style:none;margin:0 0 1rem;padding:0;text-align:left;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:0.85rem;max-height:55vh;overflow-y:auto;}
.memolist li{border-bottom:1px solid var(--washi-dim);padding:0.8rem 0.2rem;}
.memolist .memo-check{display:flex;align-items:flex-start;gap:0.6rem;cursor:pointer;}
.memolist .memo-check input{margin-top:0.3rem;flex-shrink:0;}
.memolist .rq{color:var(--ink);line-height:1.6;}
.memolist .ra{color:var(--ai);font-size:0.8rem;}
.memolist .tag2{color:var(--shu);font-size:0.72rem;border:1px solid var(--shu);padding:0.05rem 0.4rem;border-radius:2px;margin-left:0.3rem;}
.memo-empty{color:#8a8374;text-align:center;padding:1rem 0;}
.memo-toggle{
  display:inline-flex;align-items:center;gap:0.35rem;
  font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:0.8rem;color:var(--ai);margin-top:0.4rem;cursor:pointer;
}
@media (prefers-reduced-motion: reduce){.reveal{animation:none;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"><div class="bar"></div></div>
  <h1>京都 一問一答</h1>

  <div id="start" class="card start">
    <p>出題したいジャンルを1つ選んでください。「オールジャンル」なら全問題からランダム出題します。<br>選んだジャンルの中からランダムに最大10問出題します。<br>答えを入力してEnterを押すと正解が表示されます。わからなければ何も入力せずEnterでもOK。</p>
    <div class="catlabel">ジャンルを選ぶ</div>
    <div class="catgrid" id="catgrid"></div>
    <div class="catcount" id="catcount"></div>
    <button id="beginBtn">はじめる</button>
    <div class="menurow">
      <button id="memoListBtn" class="secondary">覚えたもの一覧</button>
    </div>
  </div>

  <div id="memoScreen" class="card start hidden">
    <div class="catlabel">覚えたもの一覧</div>
    <p class="memohint">チェックを外すと、その問題が再び出題対象に戻ります。</p>
    <ul class="memolist" id="memoList"></ul>
    <div class="menurow">
      <button id="memoBackBtn" class="secondary">メインメニューへ戻る</button>
    </div>
  </div>

  <div id="quiz" class="card hidden">
    <div class="progress" id="progress"></div>
    <div class="tag" id="qtag"></div>
    <p class="qtext" id="qtext"></p>
    <input type="text" id="answerInput" placeholder="答えを入力してEnter" autocomplete="off">
    <div class="hint">Enterキーで解答／もう一度Enterで次の問題へ</div>
    <div id="revealBox" class="reveal hidden">
      <div class="verdict" id="verdict"></div>
      <div class="answer" id="correctAnswer"></div>
      <div class="your" id="yourAnswer"></div>
    </div>
    <div class="btnrow">
      <button id="nextBtn" class="hidden">次の問題へ</button>
    </div>
  </div>

  <div id="final" class="card final hidden">
    <div class="score"><span id="scoreNum"></span> / <span id="scoreTotal"></span></div>
    <p>お疲れさまでした。「覚えた」にチェックを入れると、その問題は次回から出題されなくなります。</p>
    <button id="retryBtn">もう一度挑戦する</button>
    <ul class="reviewlist" id="reviewlist"></ul>
  </div>
</div>

<script>
// [question, answer, category]
const QA = [
["数万年前のナイフ形石器などが昭和30年(1955)に発見され、現在はボートの遊覧やバーベキュー場になっている右京区梅ヶ畑にある遺跡は何か。","菖蒲谷遺跡","歴史"],
["奈良時代、聖武天皇の治世に権勢を振るった貴族で、現在の京都府井手町のあたりに別業を営み、井堤寺(井手寺)を創建したと伝えられる「井手左大臣」と称された人物は誰か。","橘諸兄","歴史"],
["平安時代に令外官として設置され、治安警護を担当し、民事から行政まで関与した役職は何か。","検非違使","歴史"],
["秦氏は京都盆地西部の桂川流域に勢力を拡大させたが、奈良時代に創建した西京区にある法輪寺に虚空蔵菩薩を安置した秦氏出身の僧侶は誰か。","道昌","歴史"],
["応永6年(1399)に起こった応永の乱で大内義弘と戦い勝利し、室町幕府をより盤石なものにした将軍は誰か。","足利義満","歴史"],
["織田信長が、挙兵した足利義昭の籠る城を攻めて降伏させ、京都から追放して、室町幕府は事実上消滅した。その戦いの舞台となった城は何か。","宇治槇島城","歴史"],
["寛永18年(1641)洛北の地に自らの隠居所「凹凸おうとつか」(詩仙堂)を建てた徳川家康の元家臣は誰か。","石川丈山","歴史"],
["京都の碁所に生まれ、日本初の国産の暦「貞享暦」や地球儀、天球儀を作った江戸時代の天文学者で、この暦の功績により初代幕府天文方となった人物は誰か。","渋川春海","歴史"],
["薩摩藩の家老として活躍し、坂本龍馬を支援して亀山社中設立に力を貸した、京都で締結された薩長同盟(盟約)でも大きな役割を果たしたのは誰か。","小松帯刀","歴史"],
["陸軍第十六師団の深草への移転に伴い整備された第二軍道は、鴨川運河(琵琶湖疏水)をまたぐ。今も陸軍の星マークが橋脚に残る、その橋の名は何か。","師団橋","歴史"],
["地元ちりめん織業者らの信仰によって蚕の社から勧請された境内社「木島社」があり、狛猫があることでも知られる、京丹後市峰山町の神社はどこか。","金刀比羅神社","寺社"],
["元は源頼義が左女牛さめがい西洞院に創建した神社で、移転した東山五条では相殿に陶器神社があり、8月の陶器祭では多くの人が訪れる。この神社はどこか。","若宮八幡宮社","寺社"],
["梅宮大社にある「三石みついし」とも呼ばれる3個の神石で、紀州熊野から3羽の鳥が飛んで来て石になったと伝わり、末社の熊野社の神体となった石を何というか。","影向石","寺社"],
["僧の千観内供が肥前国より淀大明神を勧請したことに始まるとされる、明治時代に入り桂川対岸から淀城跡に移った神社はどこか。","與杼神社","寺社"],
["夢窓疎石の高弟・黙庵周諭もくあんしゅうゆが中興した善入寺を前身とし、生前敵同士だった室町幕府第二代将軍足利義詮と楠木正行の墓が並んで立つことで知られる寺院はどこか。","宝筐院","寺社"],
["伊藤若冲が草庵を建てて隠棲し、境内に若冲の墓や筆塚のほか、自ら指揮して石工に彫らせた釈迦の一代記や五百羅漢の石仏が残る寺院はどこか。","石峰寺","寺社"],
["日蓮宗の大本山である妙顕寺の塔頭寺院で、尾形光琳、乾山兄弟の墓がある寺院はどこか。","泉妙院","寺社"],
["日本三達磨の一つに数えられる達磨大師坐像が年に2回行われる万人講で公開され、「達磨堂」の通称名で知られる八幡市にある寺院はどこか。","円福寺","寺社"],
["延暦寺から六角堂への参籠の際に親鸞が身を清めたとされる「御聖水ごせいすい」という湧水がある寺院はどこか。","本願寺北山別院","寺社"],
["延鎮が開山と伝わり、霊夢により金色の水源を求めて辿りついたとされる「金生水」がある、山科区の本山修験宗の寺院はどこか。","法嚴寺","寺社"],
["徳川家康により建立された御香宮神社本殿の建築形式は何か。","五間社流造","建築"],
["仁和寺の御殿の庭園にある光格天皇遺愛の茶室「飛濤亭」と並び、尾形光琳ゆかりと伝わる茶室は何か。","遼廓亭","建築"],
["久御山町にある、かつて巨椋池の漁業者の代表を務めていた大庄屋の遺構で、鯉の欄間や鶴沢探索の雲竜の襖絵が残っている、国の登録有形文化財として一般公開されている建物の名称は何か。","旧山田家住宅","建築"],
["平成7年(1995)に開館した「京都コンサートホール」の設計をはじめ国内外で活躍し、「ポストモダン建築の旗手」として知られる建築家は誰か。","磯崎新","建築"],
["妙蓮寺の十六羅漢石庭や国指定名勝である知恩院方丈庭園を作庭したと伝わる、小堀遠州と縁のある僧は誰か。","玉淵","建築"],
["葵橋東詰北部にある下鴨神社の社家の邸内にあり、水の供給を賀茂川の伏流水による湧水という自然の力に頼っている庭園は何か。","鴨脚家庭園","建築"],
["法金剛院にある平安時代の姿を残した滝石組で、特別名勝にも指定されている人工の滝は何か。","青女の滝","建築"],
["今年(2023)公開された大徳寺の三玄院に「八方睨みの虎」などの襖絵を残した江戸時代の絵師は誰か。","原在中","建築"],
["室町時代以降、工芸の世界では「天下一」の名声を競う名人が輩出されるが、後に金座を支配し、日本の金工界をリードした一族は何家か。","後藤家","建築"],
["「京都美術協会雑誌」の編集者で近代工芸の活性化を図り、自らも図案家・画家として琳派の構図や技法を暮らしの中のデザインとして表現した人物は誰か。","神坂雪佳","建築"],
["1人の職人がすべての工程を手掛けているのが特徴で、比叡山麓や白川の里から切り出された良質の材料を造園などに用いる経済産業大臣指定伝統的工芸品は何か。","京石工芸品","文化"],
["鎌倉末期から南北朝時代にかけて武家や庶民の間で流行った、本茶の栂尾の茶とそれ以外の茶(非茶)を飲み分ける利き茶の遊びを何というか。","茶寄合","文化"],
["藤原道長が著した『御堂関白記』(国宝)をはじめ、近衛家に伝世する膨大な古典資料をもつ文庫を何というか。","陽明文庫","文化"],
["吉田神社や平安神宮などの節分行事で古式に則って再現され、大舎人が黄金四つ目の仮面を被り、盾と矛を持って扮しているのは何か。","方相氏","文化"],
["普段「おふく」を結っている年長の舞妓が、祇園祭の間だけ特別に結う髪型を何というか。","勝山","文化"],
["今年(2023)の祇園祭で、江戸時代の俳人・文人画家の与謝蕪村が描いた「琴棋書画図」を下絵に、豪華絢爛な刺繍を施した下水引を244年ぶりに復元新調した山鉾はどこか。","放下鉾","文化"],
["かつて地蔵盆で行われていた、竹や藁で編んだ籠にくじや福引で当たった景品を入れ、家の2階などの高所からロープで下へ吊り降ろし、子どもたちに届ける仕掛けを何と呼ぶか。","ふごおろし","文化"],
["「葵祭の中餅」と呼ばれた下鴨神社の名物菓子で、小豆の茹で汁でついた餅菓子を何というか。","申餅","文化"],
["北野天満宮で12月の事始めから授与され、元日の朝または元旦の祝膳の初茶に入れて飲めば、1年間を無病息災で暮らせるという縁起物を何というか。","大福梅","文化"],
["知恩院七不思議のうち、「三方正面真向きの猫」と「抜け雀」を描いたとされる絵師は誰か。","狩野信政","文化"],
["観音峠-南丹市園部町~京丹波町-峠は分水嶺で、北は由良川、南は淀川の水系になる。『養生訓』『京城勝覧』を書いたことで知られる( ) の『西北紀行』が峠の記録として最も古いといわれる。","貝原益軒","地理"],
["( )-京都府八幡市~大阪府枚方市-天正10年(1582)の山崎の合戦で、明智光秀に去就を問われた筒井順慶は、この峠に陣を置き、有利な方につこうと形勢をみたといわれ、ことわざも生まれた。","洞ヶ峠","地理"],
["( )-鷹峯~長坂越~千束~杉阪-京都の文人である島岡剣石がこの峠で詠んだ「うつせみの寂しさ故におく山の辛夷は白く鎮もいて咲く」の歌碑がある。峠を北に越えると、氷室口に至る。","京見峠","地理"],
["老ノ坂峠-京都市西京区大枝~亀岡市-かつての山陰道(現国道9号)の山城と丹波の国境で古くは大枝山(大江山)とも呼ばれ、付近には、源頼光が( )を退治した伝説が残る首塚大明神がある。","酒呑童子","地理"],
["日ノ岡峠(旧東海道)-滋賀県大津市~京都市山科区-大津から京都への難所の一つで、木食正禅上人が道の改修に取り組み、峠道は大きく改善された。荷車専用道として、舗石が並べられた( )石も有名である。","車","地理"],

function loadMemo( ){
  try {
    const raw = localStorage.getItem(MEMO_KEY);
    if(!raw) return new Set( );
    const obj = JSON.parse(raw);
    return new Set(Object.keys(obj));
  } catch(e){
    return new Set( );
  }
}
function saveMemo(set){
  try {
    const obj = {};
    set.forEach(k => { obj[k] = true; });
    localStorage.setItem(MEMO_KEY, JSON.stringify(obj));
  } catch(e){ /* storage unavailable; ignore */ }
}
let memorized = loadMemo( );

function shuffle(arr){
  const a = arr.slice( );
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random( )*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderCats( ){
  catgrid.innerHTML = '';
  CHIPS.forEach(cat=>{
    const label = document.createElement('label');
    label.className = 'catchip' + (cat === selectedCat ? ' on' : '');
    label.innerHTML = `<input type="radio" name="cat" value="${cat}"${cat === selectedCat ? ' checked' : ''}>${cat}`;
    const cb = label.querySelector('input');
    cb.addEventListener('change', ( )=>{
      selectedCat = cat;
      [...catgrid.querySelectorAll('.catchip')].forEach(l=>l.classList.remove('on'));
      label.classList.add('on');
      updateCount( );
    });
    catgrid.appendChild(label);
  });
  updateCount( );
}

function updateCount( ){
  const n = currentPool( ).length;
  catcount.textContent = `「${selectedCat}」から ${Math.min(10,n)} 問出題されます（対象問題数：${n}問）`;
  beginBtn.disabled = n === 0;
}

renderCats( );

beginBtn.addEventListener('click', startQuiz);
document.getElementById('retryBtn').addEventListener('click', ( )=>{
  finalEl.classList.add('hidden');
  startEl.classList.remove('hidden');
  updateCount( );
});
nextBtn.addEventListener('click', nextQuestion);

memoListBtn.addEventListener('click', ( )=>{
  startEl.classList.add('hidden');
  memoScreen.classList.remove('hidden');
  renderMemoList( );
});
memoBackBtn.addEventListener('click', ( )=>{
  memoScreen.classList.add('hidden');
  startEl.classList.remove('hidden');
  updateCount( );
});

function renderMemoList( ){
  memoListEl.innerHTML = '';
  const items = QA.filter(q => memorized.has(q[0]));
  if(items.length === 0){
    memoListEl.innerHTML = '<li class="memo-empty">まだ「覚えた」に登録された問題はありません。</li>';
    return;
  }
  items.forEach(([q, a, c])=>{
    const li = document.createElement('li');
    li.innerHTML = `<label class="memo-check"><input type="checkbox" checked><span><span class="rq">${q}</span><br><span class="ra">正解：${a}</span><span class="tag2">${c}</span></span></label>`;
    const cb = li.querySelector('input');
    cb.addEventListener('change', ( )=>{
      if(!cb.checked){
        memorized.delete(q);
        saveMemo(memorized);
        li.remove( );
        if(memoListEl.children.length === 0){
          memoListEl.innerHTML = '<li class="memo-empty">まだ「覚えた」に登録された問題はありません。</li>';
        }
      }
    });
    memoListEl.appendChild(li);
  });
}

function startQuiz( ){
  const pool = currentPool( );
  if(pool.length === 0) return;
  const n = Math.min(10, pool.length);
  queue = shuffle(pool).slice(0, n);
  idx = 0; score = 0; records = [];
  startEl.classList.add('hidden');
  finalEl.classList.add('hidden');
  quizEl.classList.remove('hidden');
  showQuestion( );
}

function showQuestion( ){
  revealed = false;
  const [q, , cat] = queue[idx];
  progressEl.textContent = `第 ${idx+1} 問 / ${queue.length}`;
  qtagEl.textContent = cat;
  qtextEl.textContent = q;
  inputEl.value = '';
  inputEl.disabled = false;
  revealBox.classList.add('hidden');
  nextBtn.classList.add('hidden');
  setTimeout(( )=>inputEl.focus( ), 30);
}

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter') return;
  if(quizEl.classList.contains('hidden')) return;
  e.preventDefault( );
  if(!revealed){
    revealAnswer( );
  } else {
    nextQuestion( );
  }
});

function revealAnswer( ){
  revealed = true;
  const [q, a] = queue[idx];
  const userVal = inputEl.value;
  const isCorrect = userVal.trim( ) !== '' && norm(userVal) === norm(a);
  if(isCorrect) score++;
  records.push({q, a, userVal, isCorrect});

  inputEl.disabled = true;
  revealBox.classList.remove('hidden');
  correctEl.textContent = a;
  if(userVal.trim( ) === ''){
    verdictEl.textContent = '未回答';
    verdictEl.className = 'verdict no';
    yourEl.textContent = '';
  } else if(isCorrect){
    verdictEl.textContent = '正解';
    verdictEl.className = 'verdict ok';
    yourEl.textContent = `あなたの解答：${userVal}`;
  } else {
    verdictEl.textContent = '不正解';
    verdictEl.className = 'verdict no';
    yourEl.textContent = `あなたの解答：${userVal}`;
  }
  nextBtn.textContent = idx === queue.length-1 ? '結果を見る' : '次の問題へ';
  nextBtn.classList.remove('hidden');
}

function nextQuestion( ){
  idx++;
  if(idx >= queue.length){
    showFinal( );
  } else {
    showQuestion( );
  }
}

function showFinal( ){
  quizEl.classList.add('hidden');
  finalEl.classList.remove('hidden');
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreTotal').textContent = queue.length;
  const list = document.getElementById('reviewlist');
  list.innerHTML = '';
  records.forEach((r)=>{
    const li = document.createElement('li');
    const cls = r.isCorrect ? 'ok' : 'no';
    const mark = r.isCorrect ? '○' : '×';
    const checked = memorized.has(r.q) ? 'checked' : '';
    li.innerHTML = `<span class="${cls}">${mark}</span> <span class="rq">${r.q}</span><br><span class="ra">正解：${r.a}</span>${r.userVal.trim( ) ? `　／　解答：${r.userVal}` : ''}<br><label class="memo-toggle"><input type="checkbox" class="memoCb" ${checked}>覚えた</label>`;
    const cb = li.querySelector('.memoCb');
    cb.addEventListener('change', ( )=>{
      if(cb.checked){ memorized.add(r.q); } else { memorized.delete(r.q); }
      saveMemo(memorized);
    });
    list.appendChild(li);
  });
}
</script>
</body>
</html>
